server:
  port: ${PORT:8085}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/instagram_reel_ai}
    username: ${SPRING_DATASOURCE_USERNAME:instagram_ai}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      repositories:
        enabled: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:change_me_to_a_long_random_secret}
    expiration-ms: 86400000

  openai:
    api-key: ${OPENAI_API_KEY:}
    transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
    summary-model: ${OPENAI_SUMMARY_MODEL:llama-3.3-70b-versatile}

  instagram:
    app-id: ${INSTAGRAM_APP_ID:}
    app-secret: ${INSTAGRAM_APP_SECRET:}
    access-token: ${INSTAGRAM_ACCESS_TOKEN:}
    account-id: ${INSTAGRAM_ACCOUNT_ID:}
    webhook-verify-token: ${INSTAGRAM_WEBHOOK_VERIFY_TOKEN:}
    oauth-redirect-uri: ${INSTAGRAM_OAUTH_REDIRECT_URI:http://localhost:8085/api/instagram/oauth/callback}
    frontend-redirect-uri: ${INSTAGRAM_FRONTEND_REDIRECT_URI:http://localhost:3002/instagram}
    oauth-authorize-url: ${INSTAGRAM_OAUTH_AUTHORIZE_URL:https://www.instagram.com/oauth/authorize}
    oauth-token-url: ${INSTAGRAM_OAUTH_TOKEN_URL:https://api.instagram.com/oauth/access_token}
    graph-api-base: ${INSTAGRAM_GRAPH_API_BASE:https://graph.instagram.com}
    graph-api-version: ${INSTAGRAM_GRAPH_API_VERSION:v26.0}
    oauth-scopes: ${INSTAGRAM_OAUTH_SCOPES:instagram_business_basic,instagram_business_manage_messages}
    oauth-state-ttl-minutes: 10
    webhook-signature-required: ${INSTAGRAM_WEBHOOK_SIGNATURE_REQUIRED:true}

  media:
    temp-dir: ${MEDIA_TEMP_DIR:/tmp/instagram-reel-ai}
    max-size-mb: ${MAX_MEDIA_SIZE_MB:100}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}

  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}

  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}

  cache:
    reel-ttl: ${REEL_CACHE_TTL:PT24H}

  worker:
    instance-id: ${WORKER_INSTANCE_ID:}
    heartbeat-interval-ms: ${WORKER_HEARTBEAT_INTERVAL_MS:10000}
    stale-after-ms: ${WORKER_STALE_AFTER_MS:30000}
    job-lease-seconds: ${JOB_LEASE_SECONDS:120}
    poll-batch-size: ${JOB_POLL_BATCH_SIZE:10}

  resources:
    refresh-interval-ms: ${RESOURCE_REFRESH_INTERVAL_MS:60000}
    ttl-seconds: ${RESOURCE_TTL_SECONDS:86400}

  public-submission-token:
    default-ttl-seconds: ${PUBLIC_SUBMISSION_TOKEN_TTL_SECONDS:900}

logging:
  level:
    root: INFO
    com.example.instagramreelai: DEBUG
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - [%X{correlationId}] %msg%n"
